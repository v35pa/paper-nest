[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-nest"
description = "Paper-thin static sites."
requires-python = ">=3.10"
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { attr = "paper_nest.__version__" }

[tool.setuptools.package-data]
paper_nest = ["page.html"]
